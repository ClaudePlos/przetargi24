[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "przetargi24"
version = "1.0.0"
description = "Automatyczny portal z polskimi przetargami publicznymi, zasilany z GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
przetargi = "przetargi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
