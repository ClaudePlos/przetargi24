# Kategoria: ochrona osób i mienia.
slug: ochrona
name: "Ochrona osób i mienia"
emoji: "🛡️"
order: 30
enabled: true
description: >-
  Ochrona fizyczna obiektów i imprez, usługi portierskie i dozór mienia,
  monitorowanie sygnałów alarmowych wraz z grupą interwencyjną, konwojowanie
  wartości pieniężnych, a także systemy alarmowe, kontroli dostępu
  i telewizji dozorowej.

match:
  cpv:
    - "7971"       # usługi ochroniarskie, strażnicze, patrolowe, nadzór alarmowy
    - "98341140"   # usługi dozorowania
    - "35120"      # systemy i urządzenia nadzoru i bezpieczeństwa
    # Celowo nie cały dział 35121: ogólne „urządzenia bezpieczeństwa”
    # (35121000) dołączane są do pakietów zakupów IT w projektach
    # cyberbezpieczeństwa, które z ochroną fizyczną nie mają nic wspólnego.
    - "351217"     # systemy alarmowe
  # Gwiazdka zastępuje resztę wyrazu i nie przeskakuje spacji, więc frazy
  # dwuwyrazowe wymagają sąsiadujących słów.
  keywords:
    - "ochron* fizyczn*"
    - "ochron* osób i mienia"
    - "ochroniarsk*"
    - "kwalifikowan* pracownik* ochrony"
    - "dozór mieni*"
    - "dozorowani*"
    - "usług* portiersk*"
    - "monitoring obiekt*"
    - "monitorowani* sygnał*"
    - "grup* interwencyjn*"
    - "konwojowani*"
    - "konwój wartości"
    - "zabezpieczeni* imprez*"
    - "telewizj* dozorow*"
    - "system* sygnalizacji włamania"
  # Świadomie nie ma tu fraz „kontrola dostępu", „system alarmowy",
  # „portiernia" ani „służby ochrony". Na prawdziwych danych łapały roboty
  # budowlane wspominające o kontroli dostępu, syreny alarmowe, portiernię
  # jako pomieszczenie i sprzęt kupowany *dla* służb ochrony. Właściwe
  # zamówienia na te systemy i tak wchodzą po kodach CPV 35120 i 35121.
  #
  # Słowa „ochrona" i „dozór" mają w polszczyźnie wiele znaczeń niezwiązanych
  # z ochroną fizyczną — poniższe frazy odsiewają najczęstsze pomyłki.
  # Usługi zdrowotne trafiały tu przez badania medycyny pracy dla
  # kwalifikowanych pracowników ochrony — to opis odbiorcy, nie przedmiotu.
  exclude_cpv:
    - "85"
  exclude_keywords:
    - "medycyn* pracy"
    - "dozor* techniczn*"        # badania UDT, nie ochrona
    - "dozór techniczn*"
    - "ochron* danych"           # RODO i bezpieczeństwo informacji
    - "ochron* przeciwpożarow*"
    - "ochron* środowisk*"
    - "ochron* radiologiczn*"
    - "ochron* zdrowi*"
    - "ochron* roślin"
    - "ochron* powietrza"
    - "alarm* przeciwpożarow*"
    - "sygnalizacj* pożarow*"
