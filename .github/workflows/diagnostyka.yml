# TYMCZASOWY workflow — sprawdza, które adresy źródeł odpowiadają.
# Do usunięcia po poprawieniu config/sources.yml.
name: Diagnostyka źródeł

on:
  push:
    branches: [claude/polish-tenders-portal-t3d4sf]
    paths:
      - "tools/diagnostyka.py"
      - ".github/workflows/diagnostyka.yml"

permissions:
  contents: read

jobs:
  diagnostyka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/diagnostyka.py
